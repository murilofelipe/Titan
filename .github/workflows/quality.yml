name: Testes e Qualidade

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feat/**'
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  python-quality:
    name: Backend - Qualidade Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Checagem de Sintaxe
        run: python -m py_compile cli.py
